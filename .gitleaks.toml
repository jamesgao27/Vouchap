title = "Vouchap gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "google-api-key"
description = "Google API key (Gemini etc.)"
regex = '''AIza[0-9A-Za-z\-_]{35}'''

[allowlist]
description = "Placeholders and docs without real keys"
regexTarget = "match"
regexes = [
  '''AIzaSy[A-Za-z0-9_-]{10,}example''',
  '''your_gemini_api_key''',
  '''YOUR_GEMINI_API_KEY''',
  '''your_api_key_here''',
]
